<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
/* ---------- 시작 화면 ---------- */
.splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px 16px;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,#BFE6FF 0%,#E3F4FF 38%,#FFF6E4 72%,#FBF4E6 100%);transition:opacity .35s ease;overflow:hidden}
.splash.out{opacity:0;pointer-events:none}
.splash .cl{position:absolute;opacity:.9;animation:skDrift 18s linear infinite}
.splash .cl.c2{animation-duration:26s;animation-delay:-9s}
.splash .isl{position:relative;margin-bottom:10px;animation:skBob 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 0 rgba(46,158,107,.12))}
.splash .isl canvas{display:block;image-rendering:pixelated}
.splash .isl .walker{position:absolute;left:50%;bottom:var(--gb);transform:translateX(-50%)}
.splash .glow{position:absolute;left:50%;top:22%;width:90px;height:90px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#E9D8FF 0%,rgba(233,216,255,0) 70%);animation:skPulse 2.4s ease-in-out infinite}
.splash .sub{font-family:'Gowun Dodum',var(--f-body);color:#6B5A4C;letter-spacing:.35em;font-size:15px;margin-right:-.35em}
.splash h1{font-family:'Jua',var(--f-display);font-size:clamp(54px,17vw,84px);line-height:1;color:#3A2C22;letter-spacing:.02em;
  text-shadow:4px 4px 0 #FFD23F,8px 8px 0 rgba(58,44,34,.12);margin:2px 0}
.splash .kids{font-family:'Press Start 2P',monospace;font-size:13px;color:#fff;background:#7B3FE0;padding:7px 10px 6px;border-radius:4px;box-shadow:0 4px 0 #4E22A6;letter-spacing:.15em;transform:rotate(-3deg)}
.splash .slogan{font-family:'Jua',var(--f-display);color:#FF7A2F;font-size:clamp(18px,5.4vw,23px);margin-top:12px;line-height:1.35}
.splash .go{margin-top:18px;width:auto;padding:14px 34px;font-size:20px}
.splash .hint{font-family:'Press Start 2P',monospace;font-size:9px;color:#8A7766;margin-top:10px;animation:skBlink 1.2s steps(2) infinite}
@keyframes skBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes skDrift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes skPulse{0%,100%{opacity:.55;transform:translateX(-50%) scale(.9)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}}
@keyframes skBlink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.splash .isl,.splash .cl,.splash .glow,.splash .hint{animation:none}}
</style>
<title>스터디아 왕국 키즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Do+Hyeon&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 폰 한 화면 앱. 크림 바탕 + 둥근 카드, 하단 탭. 넓은 화면에선 가운데 폰 틀 */
:root{
  --bg:#FBF4E6; --paper:#FFFDF8; --ink:#3A2C22; --muted:#8A7766; --line:#EADFCB;
  --accent:#F08A4B; --accent-ink:#FFFFFF; --accent-soft:#FDE6D3; --gold:#E2A93B;
  --good:#3E9B6B; --warn:#D9822B; --bad:#D2504A; --hp:#E5574F; --hp-bg:#F6DCD5;
  --night:#2E2440; --night-ink:#F6EEDD;
  --m:#E8484A; --e:#4FA9E8; --k:#F26B1D; --b:#1FA67A; --r:#9B4DFF; --w:#7A4B2A;
  --f-display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Noto Sans KR','Gowun Dodum',system-ui,-apple-system,sans-serif;
  --shadow:0 2px 0 rgba(90,60,30,.08),0 8px 24px rgba(90,60,30,.06);
}
/* 한 가지 밝은 톤으로 고정: 학생 화면은 픽셀 게임 세계, 학부모·선생님 화면은 크림 카드 */
:root{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modebar{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;width:100%;max-width:420px}
.modebar button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:13px;color:var(--muted)}
.modebar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.phone{width:100%;max-width:420px;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:700px){.phone{border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);height:820px;overflow:hidden}}
.screen{flex:1;overflow-y:auto;padding:16px 14px 90px;display:flex;flex-direction:column;gap:12px}
@media (max-width:699px){.screen{padding-inline:0}}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:26px;line-height:1.25} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:18px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-family:var(--f-body);font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px;font:inherit}
textarea{resize:vertical;min-height:72px}
.bar{height:12px;border-radius:999px;background:var(--hp-bg);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--hp);border-radius:999px;transition:width .5s}
.gauge > i{background:linear-gradient(90deg,var(--gold),var(--accent))}
.gauge{background:var(--accent-soft)}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media (max-width:699px){.nav{position:fixed;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}}
.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
/* onboarding */
.story{background:var(--night);color:var(--night-ink);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.story .q{font-family:var(--f-display);font-size:24px}
.rift{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#B48CFF 0%,#6C3FD1 35%,transparent 70%);opacity:.7;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.95}}
@media (prefers-reduced-motion:reduce){.rift{animation:none}}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;text-align:left;width:100%;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--f-display);font-weight:400;color:var(--accent);min-width:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);max-width:100%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
/* character */
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff;flex:none;position:relative}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid currentColor;opacity:.35}
.charcard{border-radius:24px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.charcard .dream{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font-size:14px}
/* quests */
.quest{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper)}
.quest .dot{width:10px;align-self:stretch;border-radius:8px;flex:none}
.quest .body{flex:1;min-width:0}
.quest .t{font-weight:700}
.check{width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;font-size:20px}
.quest.done{opacity:.72}
.quest.done .check{background:var(--good);border-color:var(--good);color:#fff}
.quest.locked .check{opacity:.4}
.banner{border-radius:18px;padding:12px 14px;background:var(--night);color:var(--night-ink);display:flex;gap:10px;align-items:center}
.banner .d{font-family:var(--f-display);font-size:26px;color:var(--gold);line-height:1}
.bubble{background:var(--paper);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:14px}
/* boss */
.arena{background:var(--night);color:var(--night-ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.arena .bossface{font-size:72px;text-align:center;line-height:1.1;transition:transform .15s}
.arena .bossface.hit{transform:translateX(6px) rotate(4deg);filter:brightness(1.6)}
.arena .bar{background:rgba(255,255,255,.15)}
.floatdmg{position:absolute;left:50%;top:70px;font-family:var(--f-display);font-size:30px;color:var(--gold);animation:up 1s forwards;pointer-events:none;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}
.bosstabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bosstabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 10px;font-size:13px;white-space:nowrap;flex:none}
.bosstabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.timer{font-family:var(--f-display);font-size:40px;text-align:center;font-variant-numeric:tabular-nums}
/* emotion */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 2px;font-size:11px;line-height:1.25}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.faces button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.faces button span{font-size:24px}
.faces button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.flowgrid div{border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.flowgrid div.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.flowgrid div.blank{visibility:hidden}
/* ranking */
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.rank{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:26px;text-align:center;font-family:var(--f-display);font-size:18px}
.rank .mini{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--f-display)}
.rank.me{background:var(--accent-soft);border-radius:12px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}
.table td.r,.table th.r{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:20;max-width:90%;text-align:center}
@media (max-width:699px){.toast{position:fixed}}
.sheet{position:absolute;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;z-index:30}
@media (max-width:699px){.sheet{position:fixed}}
.sheet .in{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

/* ===== 픽셀 게임 톤 (학생 화면) ===== */
:root{--px:0 -3px 0 0 #2B1D16,0 3px 0 0 #2B1D16,-3px 0 0 0 #2B1D16,3px 0 0 0 #2B1D16,0 7px 0 0 rgba(43,29,22,.3);
  --px2:0 -2px 0 #2B1D16,0 2px 0 #2B1D16,-2px 0 0 #2B1D16,2px 0 0 #2B1D16;
  --f-title:'Do Hyeon','Jua',system-ui,sans-serif; --f-pixel:'Press Start 2P',ui-monospace,monospace}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.phone.game{--bg:#86D9F0;--paper:#FFF4D6;--ink:#2B1D16;--muted:#6E5844;--line:#2B1D16;--accent:#E2453C;--accent-ink:#fff;--accent-soft:#F7C531;--gold:#F7C531;--good:#3E9B4B;--hp:#E2453C;--hp-bg:#4A2A22;--night:#2E2440;--night-ink:#F6E3B4;
  background:linear-gradient(#46B1D8 0,#86D9F0 260px,#B9ECF8 100%);color:var(--ink)}
.game .screen{gap:10px}
.game h1{font-family:var(--f-title);font-size:30px;color:#F9DDB6;letter-spacing:1px;text-shadow:2px 0 #2B1D16,-2px 0 #2B1D16,0 2px #2B1D16,0 -2px #2B1D16,2px 2px #2B1D16,-2px -2px #2B1D16,2px -2px #2B1D16,-2px 2px #2B1D16,0 5px #2B1D16}
.game h2,.game h3{font-family:var(--f-title)} .game h2{font-size:22px} .game h3{font-size:19px}
.game .card{border:0;border-radius:0;box-shadow:var(--px);margin:3px;background:var(--paper)}
.game .btn{border-radius:0;box-shadow:var(--px);margin:3px;width:calc(100% - 6px);font-family:var(--f-title);font-size:20px;background:#E2453C;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.game .btn:active{transform:translateY(3px)}
.game .btn.ghost{background:#F6E3B4;color:var(--ink);border:0;text-shadow:none;font-size:17px}
.game .btn.gold{background:#F7C531;color:var(--ink);text-shadow:none}
.game .chip{border:0;border-radius:0;background:#F6E3B4;box-shadow:var(--px2);margin:2px}
.game .chip[aria-pressed="true"]{background:#2B1D16;color:#F7C531}
.game .pill{border-radius:0;background:#2B1D16;color:#F7C531;font-weight:700}
.game .pill.red{background:#E2453C;color:#fff}.game .pill.blue{background:#5BC0EB;color:#2B1D16}.game .pill.purple{background:#8C5BD6;color:#fff}
.game .quest{border:0;border-radius:0;background:#FFFBEA;box-shadow:var(--px2);margin:2px}
.game .quest .dot{border-radius:0}
.game .quest.done{opacity:1;background:#E7F3D6}
.game .check{border:0;border-radius:0;width:auto;min-width:56px;height:36px;padding:0 10px;background:#E2453C;color:#fff;font-family:var(--f-title);font-size:16px;box-shadow:var(--px2),0 4px 0 rgba(0,0,0,.25)}
.game .quest.done .check{background:#3E9B4B}
.game .quest.locked .check{background:#B9A88E}
.game .bar{border-radius:0;background:#4A2A22;box-shadow:var(--px2);margin:2px}
.game .bar > i{border-radius:0}
.game .gauge{background:#4A2A22}.game .gauge > i{background:#F7C531}
.game .bar.charge > i{background:#5BC0EB}.game .bar.hid > i{background:#8C5BD6}
.game .nav{background:#3A2A20;border:0;box-shadow:0 -4px 0 #2B1D16}
.game .nav button{color:#C9B08A;border-radius:0;font-family:var(--f-title);font-size:14px}
.game .nav button[aria-current="page"]{background:#4A3428;color:#F7C531}
.game .story{border-radius:0;box-shadow:var(--px);margin:3px}
.game .opt{border:0;border-radius:0;background:#FFFBEA;box-shadow:var(--px2);margin:2px;width:calc(100% - 4px)}
.game .opt b{color:#E2453C;font-family:var(--f-title)}
.game .opt[aria-pressed="true"]{background:#F7C531}
.game .tabs{border:0;border-radius:0;background:#3A2A20;box-shadow:var(--px2);margin:2px}

<script>
(function(){
/* ---------- 데이터 (game-data.js) ---------- */
const {KINGDOMS,KN,TEST,JOBS,PERS,FOODS,HOBBY,GOALS,COLORS,SUBJ,SUBJ_KEYS,ACT,ORDER,BASE,DAILY_CAP,RAIDS,HIDDEN,CELLMSG,ANIMALS,ANIMAL_KEYS,BLESS_PCT,ITEM_GEAR,ITEM_CHEST}=SK;
const {addDays,parseDay,weekKey,fmt}=SK;
const TODAY=()=>SK.dayKey();
function ymd(y,m,d){return SK.key(new Date(y,m-1,d))}
function monthKeyOf(k){return k.slice(0,7)}
const fmtN=n=>Math.round(n).toLocaleString();
function pctOf(a,b){return Math.max(0,Math.min(100,Math.round(a/b*100)))}
function esc(t){return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const hydrate=root=>SK.hydrate(root);

/* ---------- 점수 ---------- */
function weekCount(a,k,st){st=st||S;const w=weekKey(k);let n=0;for(let i=0;i<7;i++){const d=addDays(w,i);const L=(st.logs||{})[d];if(!L)continue;if(a==='clean'?L.life&&L.life.clean:L.q.some(q=>q.a===a&&q.done))n++}return n}
function weekFull(a,k,st){const A=ACT[a];if(!A.wk)return false;const L=(st||S).logs[k];const doneToday=L&&L.q.some(q=>q.a===a&&q.done);return !doneToday&&weekCount(a,k,st)>=A.wk}
function qPts(q){return q.pts||ACT[q.a].pt}
function allClear(st,k){const L=(st.logs||{})[k];if(!L)return false;
  const need=ORDER.filter(a=>a!=='m1'&&a!=='school'&&!weekFull(a,k,st));
  return need.length>0&&need.every(a=>a==='clean'?L.life&&L.life.clean:L.q.some(q=>q.a===a&&q.done))}
function adjOf(L,t){return (L&&L.adj||[]).filter(x=>x.t===t)}
function dayScoreOf(st,k){const L=(st.logs||{})[k];if(!L)return {raw:0,rank:0,min:0,subjects:0,chk:0,ac:0,sb:0,bonus:0,pen:0};
  let chk=0,min=0;const subs=new Set();
  L.q.forEach(q=>{if(q.done){chk+=qPts(q);min+=ACT[q.a].min||0;subs.add(ACT[q.a].s)}});
  if(L.life&&L.life.clean)chk+=ACT.clean.pt;
  adjOf(L,'check').forEach(x=>{chk+=+x.pts||0;min+=(ACT[x.a]&&ACT[x.a].min)||0;if(ACT[x.a]&&ACT[x.a].s)subs.add(ACT[x.a].s)});
  const ac=allClear(st,k)?SK.ALLCLEAR:0;const sb=L.sb||0;
  const bonus=adjOf(L,'bonus').reduce((a,x)=>a+(+x.pts||0),0),pen=adjOf(L,'penalty').reduce((a,x)=>a+(+x.pts||0),0);
  const capped=Math.min(chk+ac,DAILY_CAP);
  return {raw:Math.max(0,chk+ac+sb+bonus-pen),rank:Math.max(0,capped+sb+bonus-pen),min,subjects:subs.size,chk,ac,sb,bonus,pen}}
function dayScore(k){return dayScoreOf(S,k)}
function hasDone(L){return L&&(L.q.some(q=>q.done)||(L.life&&L.life.clean)||adjOf(L,'check').length>0)}
/* 연속 출석: 오뚝이 공화국은 끊긴 날 1번을 막아 줌 */
function streak(st){st=st||S;let n=0,k=TODAY(),shield=st.char&&st.char.kingdom==='ukk'?1:0;if(!hasDone(st.logs[k]))k=addDays(k,-1);
  for(let i=0;i<400;i++){if(hasDone(st.logs[k])){n++}else if(shield&&hasDone(st.logs[addDays(k,-1)])){shield=0}else break;k=addDays(k,-1)}return n}
function weekScore(k){const w=weekKey(k||TODAY());let t=0;for(let i=0;i<7;i++)t+=dayScore(addDays(w,i)).rank;return t}
function monthScoreRaw(mk,st){st=st||S;mk=mk||monthKeyOf(TODAY());return Object.keys(st.logs||{}).filter(x=>x.startsWith(mk)).reduce((a,x)=>a+dayScoreOf(st,x).raw,0)}

/* ---------- 데미지 ---------- */
function qDmg(q){return q.dmg!=null?q.dmg:qPts(q)*10}
/* 과목 보스 밖에서 레이드·히든보스에만 들어가는 몫: 올클리어·연속 보너스·과목 없는 선생님 포인트 - 감점 */
function dayExtraDmg(st,k){const L=st.logs[k];if(!L)return 0;const d=dayScoreOf(st,k);let x=(d.ac+d.sb)*10;
  adjOf(L,'bonus').forEach(a=>{x+=(+a.pts||0)*10*(a.crit||1)});x-=d.pen*10;
  adjOf(L,'check').forEach(a=>{x+=(+a.pts||0)*10});
  if(L.life&&L.life.clean)x+=ACT.clean.pt*10;return x}
function dayBossDmg(st,k,s){const L=st.logs[k];if(!L)return 0;let t=0;L.q.forEach(q=>{if(q.done&&ACT[q.a].s===s)t+=qDmg(q)});
  adjOf(L,'bonus').forEach(a=>{if(a.s===s)t+=(+a.pts||0)*10*(a.crit||1)});adjOf(L,'check').forEach(a=>{if(ACT[a.a]&&ACT[a.a].s===s)t+=(+a.pts||0)*10});return t}
function dmgIn(from,to,st){st=st||S;let t=0;Object.keys(st.logs||{}).forEach(k=>{if(k<from||k>to)return;st.logs[k].q.forEach(q=>{if(q.done)t+=qDmg(q)});t+=dayExtraDmg(st,k)});return Math.max(0,t)}
function monthBossDmg(s,mk,st){st=st||S;let t=0;Object.keys(st.logs||{}).forEach(k=>{if(k.startsWith(mk))t+=dayBossDmg(st,k,s)});return t}
function bossLeft(s,mk){return Math.max(0,SUBJ[s].hp-monthBossDmg(s,mk||monthKeyOf(TODAY())))}
function raidInst(r,today){today=today||TODAY();const y=+today.slice(0,4);let best=null;
  [y-1,y,y+1].forEach(yy=>r.specs.forEach(sp=>{const openStart=ymd(yy,sp.m,1);const openEnd=ymd(yy,sp.m+1,0);const accStart=ymd(yy,sp.m-sp.n,1);
    if(openEnd>=today&&(!best||openEnd<best.openEnd))best={r,sp,openStart,openEnd,accStart,id:r.id+'-'+openStart}}));
  const b=best,cap=b.sp.n*BASE*10,hp=cap+1500;const open=today>=b.openStart;
  const charge=dmgIn(b.accStart,open?addDays(b.openStart,-1):today);
  const items=(S.itemUse||[]).filter(u=>u.inst===b.id).reduce((a,u)=>a+u.dmg,0);
  const direct=open?dmgIn(b.openStart,today)+items:0;
  const left=open?Math.max(0,hp-Math.min(charge,cap)-direct):hp;
  return {...b,cap,hp,open,charge,direct,items,left}}
function hiddenState(st){st=st||S;const t=TODAY();const y=+t.slice(0,4),m=+t.slice(5,7);const start=ymd(m>=3?y:y-1,3,1);const d=dmgIn(start,t,st);return {start,dmg:d,left:Math.max(0,HIDDEN.hp-d)}}
function blessActive(){return S.bless&&TODAY()<=S.bless.until}
function partyOn(k){const f=S.party&&ALL[S.party];return !!(f&&f.daily&&f.daily[k]&&f.daily[k].r>0)}

/* ---------- 장면 ---------- */
function tileURL(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return c.toDataURL()}
let GROUND='',SAW='';
try{GROUND=tileURL(24,32,g=>{g.fillStyle='#6CC04A';g.fillRect(0,0,24,9);g.fillStyle='#A6DE6B';g.fillRect(0,0,24,2);
  g.fillStyle='#3E8E3A';[[2,7],[7,8],[12,6],[17,8],[21,7]].forEach(([x,y])=>g.fillRect(x,y,3,3));
  g.fillStyle='#8E8F98';g.fillRect(0,9,24,23);g.fillStyle='#9EA0A9';[[1,11,10,5],[13,11,10,5],[7,17,10,5],[1,23,10,5],[13,23,10,5]].forEach(a=>g.fillRect(...a));
  g.fillStyle='#B3B5BD';[[1,11,10,1],[13,11,10,1],[7,17,10,1],[1,23,10,1],[13,23,10,1]].forEach(a=>g.fillRect(...a));g.fillStyle='#FF6B8A';g.fillRect(5,0,2,2);g.fillStyle='#FFD84A';g.fillRect(18,1,2,2)});
 SAW=tileURL(12,6,g=>{g.fillStyle='#B9ECF8';g.fillRect(4,0,4,2);g.fillRect(2,2,8,2);g.fillRect(0,4,12,2)})}catch(e){}
function sceneHTML(inner,opts){opts=opts||{};
  const clouds=[[14,26],[40,34],[22,30]].map(([y,d],i)=>`<div class="cloud" data-spr="cloud" data-sc="4" style="top:${y}px;left:0;animation-duration:${d}s;animation-delay:-${i*9}s"></div>`).join('');
  return `<div class="scene" id="scene">${clouds}<div class="saw" style="background-image:url(${SAW})"></div>
   ${opts.deco===false?'':'<div data-spr="tree" data-sc="5" style="position:absolute;bottom:58px;left:-14px"></div><div data-spr="mush" data-sc="4" style="position:absolute;bottom:60px;left:120px"></div>'}
   <div class="ground" style="background-image:url(${GROUND})"></div>${inner}
   <div class="fx" id="fx"></div><canvas class="fx" id="pfx" width="420" height="250"></canvas><div class="flash" id="flash"></div></div>`}
function heroHTML(){const c=S.char||{};return `<div class="hero" id="hero"><div class="aura" style="background:${esc(c.color||'#EE7FAE')}"></div>${SK.heroTag(c,6)}</div>`}
const FIRE=['#FFE066','#F7A531','#E2453C','#FFF3B0','#D7263D'];
function burst(x,y,colors,n){const cv=document.getElementById('pfx');if(!cv||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const g=cv.getContext('2d');const sx=cv.width/(cv.clientWidth||420);
  const P=[...Array(n||28)].map(()=>({x:x*sx,y:y*sx,vx:(Math.random()-.5)*9,vy:(Math.random()-.8)*8,s:4+Math.floor(Math.random()*3)*3,c:colors[Math.floor(Math.random()*colors.length)],l:26+Math.random()*16}));
  let f=0;(function step(){g.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{if(p.l<=0)return;p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;g.fillStyle=p.c;g.fillRect(Math.round(p.x/3)*3,Math.round(p.y/3)*3,p.s,p.s)});if(++f<46)requestAnimationFrame(step);else g.clearRect(0,0,cv.width,cv.height)})()}
function dmgText(txt,x,y,big){const fx=document.getElementById('fx');if(!fx)return;const d=document.createElement('div');d.className='dmg'+(big?' big':'');d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';fx.appendChild(d);setTimeout(()=>d.remove(),1200)}

function computeDaily(st){const out={};Object.keys(st.logs||{}).forEach(k=>{const d=dayScoreOf(st,k);const e=st.emo&&st.emo[k];const L=st.logs[k];
  if(d.raw||e||L.hiddenReq){const bd={};SUBJ_KEYS.forEach(s=>{const v=dayBossDmg(st,k,s);if(v)bd[s]=v});
    let dm=dayExtraDmg(st,k);L.q.forEach(q=>{if(q.done)dm+=qDmg(q)});
    out[k]={r:d.rank,raw:d.raw,min:d.min,n:d.subjects,cell:e?e.cell:null,cond:e?e.cond:null,al:e&&e.alert?1:0,hr:L.hiddenReq&&!L.hidden?1:0,dm:Math.max(0,dm),bd}}});return out}

function save(){
  if(READONLY)return;S.rev=(S.rev||0)+1;S.daily=computeDaily(S);cacheLocal();
  if(MODE_DB){setDirty(true);setSync('wait');clearTimeout(writeTimer);writeTimer=setTimeout(flush,1200)}}
async function flush(){
  if(!MODE_DB||READONLY)return;clearTimeout(writeTimer);clearTimeout(retryTimer);
  if(flushing){flushAgain=true;return}
  flushing=true;const sentRev=S.rev;setSync('saving');
  try{const j=await api('save',{state:JSON.stringify(S),rev:S.rev});
    const changed=S.rev!==sentRev;S.rev=Math.max(S.rev||0,j.rev||0);mergeServer(j);cacheLocal();
    if(!changed)setDirty(false);failCount=0;setSync(changed?'wait':'ok')}
  catch(e){if(e.code==='auth'){flushing=false;forceLogout(e.message);return}
    failCount++;setSync('fail');
    if(e.code!=='network'&&e.code!=='timeout'&&failCount<=2&&window.RR_REPORT)RR_REPORT('저장 실패: '+e.message,'',e.code);
    retryTimer=setTimeout(flush,Math.min(60000,5000*failCount))}
  finally{flushing=false;if(flushAgain){flushAgain=false;flush()}}}
/* 선생님이 승인한 미션1, 선생님이 넣은 체크·추가 포인트·감점을 내 기록에 합침 */
function mergeServer(j){let ch=false,m1=false;
  (j.approved||[]).forEach(d=>{const L=S.logs&&S.logs[d];if(!L)return;const q=L.q.find(x=>x.a==='m1');
    if(!L.hidden||(q&&!q.done)){L.hidden=1;if(q&&!q.done){q.done=true;q.at=Date.now();let mult=1+(blessActive()?BLESS_PCT/100:0);if(S.char&&S.char.kingdom==='hc')mult*=2;q.dmg=Math.round(qPts(q)*10*mult)}
      S.bless={from:d,until:addDays(d,6)};ch=true;m1=true}});
  if(j.adj){const by={};j.adj.forEach(a=>{(by[a.date]=by[a.date]||[]).push(a)});
    const dates=new Set([...Object.keys(by),...Object.keys(S.logs||{}).filter(d=>S.logs[d].adj&&S.logs[d].adj.length)]);
    dates.forEach(d=>{const L=log(d);const nw=(by[d]||[]).map(a=>({t:a.t,a:a.a||'',s:a.s||'',pts:+a.pts||0,why:a.why||'',uid:a.uid,crit:a.t==='bonus'&&S.char&&S.char.kingdom==='hc'?2:1}));
      if(JSON.stringify(L.adj||[])!==JSON.stringify(nw)){L.adj=nw;ch=true}})}
  if(ch){S.daily=computeDaily(S);cacheLocal();if(m1)toast('숙제검사 확인 완료! 미션1 5점 + 마스터의 가호');if(canRerender())render()}}

async function api(action,data,opt){
  if(!API){const e=new Error('서버 주소가 없어요');e.code='offline';throw e}
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;const to=setTimeout(()=>ctl&&ctl.abort(),(opt&&opt.timeout)||30000);
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:AUTH&&AUTH.token||''},data||{})),signal:ctl?ctl.signal:undefined,keepalive:!!(opt&&opt.keepalive)});
    let j;try{j=await r.json()}catch(x){const e=new Error('서버 응답을 읽지 못했어요');e.code='server';throw e}
    if(!j.ok){const e=new Error(j.error||'오류가 났어요');e.code=j.code||'server';throw e}return j}
  catch(e){if(e.name==='AbortError'){const x=new Error('인터넷이 느려요');x.code='timeout';throw x}if(!e.code){e.code='network';e.message='인터넷 연결을 확인해 주세요'}throw e}
  finally{clearTimeout(to)}}

function log(k){k=k||TODAY();if(!S.logs[k])S.logs[k]={q:ORDER.filter(a=>!ACT[a].life).map(a=>({a,done:false})),life:{},hidden:0};
  const L=S.logs[k];ORDER.filter(a=>!ACT[a].life).forEach(a=>{if(!L.q.some(q=>q.a===a))L.q.push({a,done:false})});if(!L.life)L.life={};return L}

/* ---------- 데미지 공식: 1점 = 10, 버프 합 최대 +100%, 한 번에 최대 4배 ---------- */
function damageFor(q,L,k){
  const base=qPts(q)*10;const kd=S.char.kingdom;let bonus=0,crit=1;const why=[];
  if(kd==='nj'){const b=Math.min(30,2*streak());if(b){bonus+=b;why.push('루틴 쌓기 +'+b+'%')}}
  if(kd==='ddk'){const done=L.q.filter(x=>x.done&&x!==q).length;const b=Math.min(25,5*done);if(b){bonus+=b;why.push('연속 콤보 +'+b+'%')}}
  if(kd==='gim'&&q.a==='m2'){const n=Object.values(S.logs).reduce((a,l)=>a+l.q.filter(x=>x.done&&x.a==='m2').length,0);const b=Math.min(30,5*n);bonus+=b;why.push('다시 풀기 +'+b+'%')}
  if(kd==='gds'&&partyOn(k)){bonus+=30;why.push('함께 힘 +30%')}
  if(kd==='ukk'&&!L.q.some(x=>x.done&&x!==q)&&![1,2,3].some(i=>hasDone(S.logs[addDays(k,-i)]))&&Object.keys(S.logs).some(d=>d<addDays(k,-3)&&hasDone(S.logs[d]))){bonus+=50;why.push('다시 일어나기 +50%')}
  const pot=S.potion[k];if(pot&&pot.until>Date.now()){bonus+=15;why.push('힘내기 물약 +15%')}
  if(blessActive()){bonus+=BLESS_PCT;why.push('마스터의 가호 +'+BLESS_PCT+'%')}
  bonus=Math.min(100,bonus);
  let mult=(1+bonus/100)*crit;
  if(S.gauge>=100){mult*=3;S.gauge=0;why.push('궁극기 ×3')}
  mult=Math.min(4,mult);
  return {dmg:Math.round(base*mult),why}}

    <button class="check" data-m1="1" ${L.hidden||L.hiddenReq||wf||closed?'disabled':''}>${L.hidden?'✓':L.hiddenReq?'대기':wf?'끝':'알리기'}</button></div>`}
  return `<div class="quest ${q.done?'done':''} ${(wf||closed)&&!q.done?'locked':''}"><span class="dot" style="background:${subjDot(A.s)}"></span>
    <div class="body"><div class="t">${esc(A.n)}</div><div class="tiny muted">${A.pt}점 · ${wf&&!q.done?'이번 주는 다 채웠어!':wkTxt}${A.s?' · '+esc(SUBJ[A.s].boss):''}</div></div>
    <button class="check" data-i="${i}" aria-label="${esc(A.n)} ${q.done?'완료 취소':'완료하고 공격'}" ${(wf||closed)&&!q.done||closed?'disabled':''}>${q.done?'✓':'공격!'}</button></div>`}

/* "정말 다 했니?" 확인창 */

  phone.appendChild(sh);sh.querySelector('#no').onclick=()=>sh.remove();sh.querySelector('#yes').onclick=()=>{sh.remove();yes()};sh.onclick=e=>{if(e.target===sh)sh.remove()}}
function askQuest(i){const k=TODAY(),L=log(k),q=L.q[i];if(SK.closed()){toast('밤 10시가 지나서 오늘 체크는 마감됐어');return}
  if(q.done)return toggleQuest(i);if(weekFull(q.a,k)){toast('이번 주는 다 채웠어!');return}
  confirmSheet('정말 다 했니?',ACT[q.a].n+'을(를) 끝까지 했으면 눌러 줘. 거짓 체크는 감점돼요.',()=>toggleQuest(i))}
/* 연속 보너스(3일·7일)와 연속 출석 기록 */
function afterCheck(k){const L=log(k);const n=hasDone(L)?streak():0;L.sb=n===3?SK.STREAK3:(n>0&&n%7===0)?SK.STREAK7:0}
function toggleQuest(i){
  const k=TODAY(),L=log(k),q=L.q[i];
  if(!q.done){
    const s=ACT[q.a].s;const mk=monthKeyOf(k);const before=monthBossDmg(s,mk);
    const r=damageFor(q,L,k);q.done=true;q.at=Date.now();q.dmg=r.dmg;afterCheck(k);
    save();
    UI.pendingFx={s,before,dmg:r.dmg,pts:qPts(q),why:r.why,killed:before<SUBJ[s].hp&&before+r.dmg>=SUBJ[s].hp,ac:dayScore(k).ac};
    UI.tab='boss';UI.boss=s;render();scr.scrollTop=0;window.scrollTo(0,0);return;
  } else {
    q.done=false;delete q.dmg;q.cancelled=(q.cancelled||0)+1;afterCheck(k);save();toast('체크를 취소했어요 (취소한 기록은 남아요)');
  }

/* ---------- 랭킹: 순위 숫자는 1~3등 메달만, 나머지는 지도 위 위치 ---------- */
function roster(){
  const list=[];Object.keys(ALL).forEach(id=>{const d=ALL[id];if(d&&d.char)list.push({id,d})});
  if(!MODE_DB&&S.char)list.push({id:'me',d:S});
  if(MODE_DB&&S.char&&!list.some(x=>x.id===UID))list.push({id:UID,d:S});
  return list.map(x=>x.id===UID||x.id==='me'?{id:x.id,d:{...S,daily:computeDaily(S)}}:x)}
function sumDays(d,keys){const dl=d.daily||{};return keys.reduce((a,k)=>a+(dl[k]?dl[k].r:0),0)}
function periodKeys(t){const k=TODAY();
  if(t==='week'){const w=weekKey(k);return [...Array(7)].map((_,i)=>addDays(w,i))}
  if(t==='lastweek'){const w=addDays(weekKey(k),-7);return [...Array(7)].map((_,i)=>addDays(w,i))}
  const pre=k.slice(0,7);const out=[];let d=pre+'-01';while(d.slice(0,7)===pre){out.push(d);d=addDays(d,1)}return out}
const MEDAL=['🥇','🥈','🥉'];
function trackHTML(list,me){const max=Math.max(1,...list.map(x=>x.v));
  return `<div class="track">${list.map((x,i)=>{const pos=(x.v/max).toFixed(3);const lane=i%5;return `<div class="runner ${x.me?'me':''}" style="left:calc((100% - 150px) * ${pos});top:${10+lane*36}px" title="${esc(x.n)}">${SK.heroTag(x.c,2)}<span class="tag">${i<3&&x.v>0?MEDAL[i]+' ':''}${esc(x.n)}</span></div>`}).join('')}<div class="goal">🏁</div></div>`}

  if(t==='zone'){

  }
  scr.innerHTML=h;scr.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{UI.rankTab=b.dataset.t;render()});

  const homeTxt={불안:'점수 이야기보다 "어디가 제일 어려웠어?" 하나만 물어봐 주세요.',걱정:'헷갈린 내용을 보호자에게 설명해 달라고 해 보세요. 말로 하면 정리가 됩니다.',무관심:'아이의 꿈 카드 이야기를 꺼내 공부와 이어 주세요.',지루함:'내일은 15분 타이머 도전을 함께 걸어 보세요.',이완:'실수가 없었는지 한 문제만 같이 확인해 보세요.',통제:'조금 어려운 문제에 도전해 보자고 권해 주세요.',각성:'끝까지 해낸 것을 구체적으로 칭찬해 주세요.',몰입:'방해하지 않는 것이 가장 좋은 응원입니다.'};
  const s4='가정에서는: '+(e?homeTxt[e.cell]:'저녁에 오늘 한 공부 하나만 물어봐 주세요.');
  return [s1,s2,s3,s4];
}
function renderParent(){
  const t=UI.parentTab,k=TODAY();let h=`<div><p class="tiny muted">보호자 리포트 · ${esc(S.char.name)} (${KINGDOMS[S.char.kingdom].n})</p>`;
  if(t==='day'){
    const sc=dayScore(k),e=S.emo[k],L=S.logs[k];const sent=parentSentences(k);
    h+=`<h1>${fmt(k)} 하루 리포트</h1></div>
    <div class="card"><div class="row" style="justify-content:space-around;text-align:center">
      <div><p class="tiny muted">체크</p><p class="num" style="font-size:24px;font-family:var(--f-display)">${doneList(L).length}</p></div>
      <div><p class="tiny muted">예상 시간</p><p class="num" style="font-size:24px;font-family:var(--f-display)">${Math.floor(sc.min/60)}h ${sc.min%60}m</p></div>
      <div><p class="tiny muted">점수</p><p class="num" style="font-size:24px;font-family:var(--f-display)">${sc.raw}</p></div></div></div>
    ${sent?`<div class="card">${sent.map((s,i)=>`<p class="${i===3?'':'small'}" ${i===3?'style="font-weight:700"':''}>${esc(s)}</p>`).join('')}</div>`:`<div class="card"><p class="small muted">아직 오늘 체크한 공부가 없습니다. 체크는 밤 10시까지 할 수 있어요.</p></div>`}
    ${L&&hasDone(L)?`<div class="card"><h3>오늘 한 공부</h3>${doneList(L).map(a=>`<div class="row between small"><span><span style="display:inline-block;width:8px;height:8px;background:${a.s?'var(--'+a.s+')':'var(--gold)'};margin-right:6px"></span>${esc(a.n)}</span><span class="num muted">${a.min?a.min+'분 · ':''}${a.pt}점</span></div>`).join('')}
      ${L.hiddenReq?`<p class="tiny muted">미션1 숙제검사: ${L.hidden?'선생님 확인 완료':'선생님 확인 기다리는 중'}</p>`:''}${adjOf(L,'penalty').length?`<p class="tiny" style="color:var(--bad)">감점 ${adjOf(L,'penalty').reduce((a,x)=>a+x.pts,0)}점</p>`:''}</div>`:''}
    ${e?`<div class="card"><h3>마음 8칸</h3>${flowGrid(e.cell)}${e.share&&e.text?`<p class="small">아이의 한마디: "${esc(e.text)}"</p>`:'<p class="tiny muted">아이가 남긴 말은 아이가 공개를 켰을 때만 보입니다.</p>'}</div>`:''}
    <div class="card"><h3>점수 변화</h3><p class="small">이번 주 ${weekScore()}점 · 지난주보다 ${weekScore()-weekScore(addDays(k,-7))>=0?'+':''}${weekScore()-weekScore(addDays(k,-7))}점</p><p class="tiny muted">다른 아이와의 순위는 보호자 화면에 보이지 않습니다.</p></div>`;
  }
  if(t==='week'){
    const w=weekKey(k);const days=[...Array(7)].map((_,i)=>addDays(w,i));const vals=days.map(d=>dayScore(d));const mx=Math.max(20,...vals.map(v=>v.raw));
    const cnt={};days.forEach(d=>doneList(S.logs[d]).forEach(a=>{cnt[a.n]=(cnt[a.n]||0)+1}));
    const W=300,H=150,bw=30;
    h+=`<h1>주간 리포트</h1><p class="small muted">${fmt(w)} ~ ${fmt(days[6])}</p></div>
    <div class="card"><h3>요일별 점수</h3><div class="tscroll"><svg viewBox="0 0 ${W} ${H+42}" width="100%" role="img" aria-label="요일별 점수 막대">
      ${[0,.5,1].map(f=>`<line x1="24" x2="${W}" y1="${10+H*(1-f)}" y2="${10+H*(1-f)}" stroke="var(--line)"/><text x="0" y="${14+H*(1-f)}">${Math.round(mx*f)}</text>`).join('')}
      ${vals.map((v,i)=>{const x=34+i*38,hh=H*v.raw/mx;const empty=!hasDone(S.logs[days[i]]);return `<rect x="${x}" y="${10+H-hh}" width="${bw}" height="${hh}" rx="6" fill="${days[i]===k?'var(--accent)':'var(--gold)'}"/>${v.raw?`<text x="${x+bw/2}" y="${6+H-hh}" text-anchor="middle">${v.raw}</text>`:''}<text x="${x+bw/2}" y="${H+24}" text-anchor="middle">${'월화수목금토일'[i]}</text>${empty&&days[i]<k?`<text x="${x+bw/2}" y="${H+38}" text-anchor="middle" style="fill:var(--bad)">빈날</text>`:''}`}).join('')}
    </svg></div></div>
    <div class="card"><h3>이번 주 체크 횟수</h3>${ORDER.map(a=>{const A=ACT[a];const n=cnt[A.n]||0;const mxn=A.wk||7;return `<div class="row small"><span style="width:120px">${esc(A.n)}</span><div class="bar" style="flex:1;background:var(--bg)"><i style="width:${pctOf(n,mxn)}%;background:${A.s?'var(--'+A.s+')':'var(--gold)'}"></i></div><span class="num" style="width:36px;text-align:right">${n}/${mxn}</span></div>`}).join('')}</div>`;
  }
  if(t==='month'){
    const m=k.slice(0,7);const ds=Object.keys(S.logs).filter(d=>d.startsWith(m)).sort();const ms=monthScoreRaw();const stg=SK.stage(ms);
    const path=Object.keys(S.emo).filter(d=>d.startsWith(m)).sort().map(d=>[d,S.emo[d].cell]);
    h+=`<h1>월간 리포트</h1><p class="small muted">${Number(m.slice(5))}월 누적</p></div>
    <div class="card"><div class="row between"><h3>이달 점수</h3><span class="num" style="font-family:var(--f-display);font-size:24px">${ms} / ${BASE}점</span></div><div class="bar gauge"><i style="width:${pctOf(ms,BASE)}%"></i></div><p class="small muted">성장 단계 '${esc(stg[1])}' · 과목 보스 ${6-SUBJ_KEYS.filter(x=>bossLeft(x)).length}/6 처치</p><p class="small muted">기록한 날 ${ds.filter(d=>hasDone(S.logs[d])).length}일 · 연속 출석 ${streak()}일</p></div>
    <div class="card"><h3>마음 칸 이동</h3>${path.length?`<div class="chips">${path.map(([d,c])=>`<span class="pill">${fmt(d)} ${c}</span>`).join('')}</div>`:'<p class="small muted">마음 체크 기록이 쌓이면 보입니다.</p>'}</div>`;
  }
  if(t==='study'){
    const w=weekKey(k);const days=[...Array(7)].map((_,i)=>addDays(w,i));const mk=k.slice(0,7);
    const TIP={m:'수학은 매일 조금씩이 가장 좋아요. 틀린 문제를 미션2(채점하고 고치기)로 다시 보는지 확인해 주세요.',e:'영어는 단어를 매일 조금씩 소리 내어 읽는 습관이 도움이 돼요.',k:'국어는 받아쓰기·맞춤법과 글의 중심 문장 찾기를 함께 봐 주세요.',b:'EBS 강의를 듣고 나서 오늘 배운 것 한 가지를 말로 설명해 보게 해 주세요.',r:'책을 읽고 나서 "어떤 장면이 제일 재밌었어?" 하나만 물어봐 주세요.',w:'숙제는 미루지 않고 그날 끝내는 습관이 가장 중요해요.'};
    h+=`<h1>과목별</h1><p class="small muted">${fmt(w)} ~ ${fmt(days[6])}</p></div>
    ${SUBJ_KEYS.map(s=>{const B=SUBJ[s];let n=0,mn=0;days.forEach(d=>doneList(S.logs[d]).forEach(a=>{if(a.s===s){n++;mn+=a.min||0}}));
      return `<div class="card"><div class="row between"><h3><span style="color:var(--${s})">●</span> ${B.n}</h3><span class="small muted num">이번 주 ${n}번 · 약 ${mn}분</span></div>
        <div class="row small"><span data-spr="${s}" data-sc="2"></span><span>${esc(B.boss)} ${bossLeft(s,mk)?'HP '+pctOf(bossLeft(s,mk),B.hp)+'% 남음':'처치 완료!'}</span></div>
        <p class="tiny muted">${TIP[s]}</p></div>`}).join('')}`;
  }
  if(t==='heart'){
    const last=[0,1,2].map(i=>S.emo[addDays(k,-i)]);const hard3=last.every(e=>e&&e.cond===1);
    const streakBad=last.every(e=>e&&['불안','무관심'].includes(e.cell));
    h+=`<h1>마음 신호</h1></div>
    <div class="card"><div class="row between"><h3>'너무 힘들어' 3일 연속</h3><span class="pill" style="${hard3?'background:var(--bad);color:#fff':''}">${hard3?'알림':'괜찮음'}</span></div><p class="small muted">최근 3일: ${last.map(e=>e?FACES[(e.cond||3)-1][1]:'기록 없음').join(' → ')}</p></div>
    <div class="card"><div class="row between"><h3>불안·무관심 3일 연속</h3><span class="pill" style="${streakBad?'background:var(--bad);color:#fff':''}">${streakBad?'알림':'괜찮음'}</span></div><p class="small muted">최근 3일: ${last.map(e=>e?e.cell:'기록 없음').join(' → ')}</p></div>
    <div class="card"><p class="small">신호가 보이면 선생님이 보호자께 연락드립니다. 힘든 상황이 이어지면 청소년상담 1388(전화 1388)에서 도움을 받을 수 있어요.</p></div>`;
  }
  scr.innerHTML=h;hydrate(scr);
}

function canRerender(){return !document.querySelector('.sheet')&&!document.querySelector('.modal')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))&&!(UI.tab==='emo')&&S.char}
function setFoot(){const f=document.getElementById('foot');if(!f)return;
  f.textContent=PARENT_CODE?'보호자 화면 · 읽기 전용':NEED_LOGIN?'':!API?'서버 주소(config.js)가 없어 이 기기에만 저장돼요.':
   ({ok:'기록은 자동으로 저장돼요 ✓',saving:'저장 중...',wait:'곧 저장돼요',fail:'저장 대기 중 · 인터넷이 되면 자동으로 올라가요',offline:'서버에 연결하지 못해 이 기기에 보관 중이에요',loading:'기록을 불러오는 중...'}[SYNC]||'')}
async function loadParent(){try{const j=await api('parent',{code:PARENT_CODE});S=j.state?JSON.parse(j.state):freshState();PARENT_ERR=''}catch(e){if(!S.char){S=freshState();PARENT_ERR=e.message}}LOADING=false;setFoot();render()}
/* ---------- 시작 화면 (보호자 링크가 아닐 때, 브라우저를 열 때마다 한 번) ---------- */
(function(){const sp=document.getElementById('splash');if(!sp)return;
  let seen=false;try{seen=sessionStorage.getItem('sk-splash')==='1'}catch(e){}
  if(PARENT_CODE||seen){sp.remove();return}
  sp.hidden=false;SK.hydrate(sp);
  let done=false;const close=()=>{if(done)return;done=true;try{sessionStorage.setItem('sk-splash','1')}catch(e){}sp.classList.add('out');setTimeout(()=>sp.remove(),400)};
  sp.addEventListener('click',close);document.addEventListener('keydown',function k(e){if(e.key==='Enter'||e.key===' '){close();document.removeEventListener('keydown',k)}});
  setTimeout(close,4500)})();
async function boot(){
  if(PARENT_CODE){render();await loadParent();setInterval(()=>{if(!document.hidden)loadParent()},5*60000);return}
  if(!API){S=load()||freshState();LOADING=false;setFoot();render();return}
  if(!AUTH||!AUTH.token){LOADING=false;NEED_LOGIN=true;setFoot();render();checkVersion();return}
  checkVersion();startSession();
}
boot();
/* 밤 10시가 되면 화면을 한 번 새로 그려 체크 버튼을 잠금 */
setInterval(()=>{if(UI.mode==='student'&&UI.tab==='today'&&S.char&&canRerender()&&SK.closed()&&!UI._closedDrawn){UI._closedDrawn=1;render()}},60000);
})();
</script>
</body>
