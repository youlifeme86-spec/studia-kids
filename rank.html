<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2E2440">
<title>스터디아 왕국 키즈 랭킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script>window.PAGE_VERSION='2026.11.27-1424';/* 옛 화면이 캐시에 남아 있으면 새 버전으로 한 번 다시 불러와요 */
(function(){fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){if(!v||!v.version||v.version===window.PAGE_VERSION)return;var k='sk-reload-'+v.version;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){return}var u=new URL(location.href);u.searchParams.set('v',v.version);location.replace(u.toString())}).catch(function(){})})();</script>
<script src="config.js?v=2026.11.27-1424"></script>
<script src="game-data.js?v=2026.11.27-1424"></script>
<style>
:root{--sky:#46B1D8;--sky2:#86D9F0;--paper:#FFF4D6;--paper2:#FFFBEA;--ink:#2B1D16;--muted:#6E5844;--red:#E2453C;--gold:#F7C531;--night:#2E2440;--night2:#3A2A20;--blue:#5BC0EB;--purple:#8C5BD6;--green:#3E9B4B;
  --px:0 -3px 0 0 #2B1D16,0 3px 0 0 #2B1D16,-3px 0 0 0 #2B1D16,3px 0 0 0 #2B1D16,0 7px 0 0 rgba(43,29,22,.3);--px2:0 -2px 0 #2B1D16,0 2px 0 #2B1D16,-2px 0 0 #2B1D16,2px 0 0 #2B1D16;
  --f-title:'Do Hyeon',system-ui,sans-serif;--f-pixel:'Press Start 2P',ui-monospace,monospace;--f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:linear-gradient(#46B1D8 0,#86D9F0 300px,#B9ECF8 100%);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-body);min-height:100vh}
h1,h2,h3{font-family:var(--f-title);font-weight:400;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:14px}
.title{font-size:34px;color:#F9DDB6;letter-spacing:1px;text-shadow:2px 0 #2B1D16,-2px 0 #2B1D16,0 2px #2B1D16,0 -2px #2B1D16,2px 2px #2B1D16,-2px -2px #2B1D16,2px -2px #2B1D16,-2px 2px #2B1D16,0 5px #2B1D16}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top .sp{flex:1}
.tag{background:var(--paper);box-shadow:var(--px2);padding:4px 8px;font-family:var(--f-pixel);font-size:9px;margin:2px}
.card{background:var(--paper);box-shadow:var(--px);margin:3px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.dark{background:var(--night2);color:#F6E3B4}
.tabs{display:flex;gap:4px;background:var(--night2);box-shadow:var(--px2);margin:2px;padding:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:#C9B08A;padding:8px 12px;font-family:var(--f-title);font-size:17px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{border:0;background:#F6E3B4;box-shadow:var(--px2);margin:2px;padding:5px 11px;font-size:14px}
.sub button[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.btn{border:0;background:var(--red);color:#fff;font-family:var(--f-title);font-size:18px;padding:9px 14px;box-shadow:var(--px2);margin:2px}
.btn.ghost{background:#F6E3B4;color:var(--ink);font-family:var(--f-body);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:2px dotted #C9B08A}
.rank:last-child{border-bottom:0}
.rank .no{width:30px;text-align:center;font-family:var(--f-title);font-size:22px;flex:none}
.rank.top1{background:#FFE89A}.rank.top2{background:#F1EBDD}.rank.top3{background:#F6DCC4}
.rank .who{flex:1;min-width:0}
.rank .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}
.pxn{font-family:var(--f-pixel);font-size:11px}
.small{font-size:13px}.tiny{font-size:12px}.muted{color:var(--muted)}
.dark .muted{color:#C9B08A}
.bar{height:10px;background:#4A2A22;box-shadow:var(--px2);margin:2px}
.bar>i{display:block;height:100%;background:var(--red)}
.bar.gold>i{background:var(--gold)}.bar.blue>i{background:var(--blue)}.bar.purple>i{background:var(--purple)}
.pill{display:inline-block;background:var(--ink);color:var(--gold);font-size:12px;padding:1px 7px;font-weight:700;white-space:nowrap}
.pill.red{background:var(--red);color:#fff}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.av{flex:none;width:40px;height:40px;display:grid;place-items:center;background:rgba(255,255,255,.6);box-shadow:var(--px2)}
.kd{display:flex;gap:10px;align-items:center;padding:8px;background:var(--paper2);box-shadow:var(--px2);margin:2px}
.kd .crest{width:14px;align-self:stretch;flex:none}
.kd .members{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.boss{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;background:var(--paper2);box-shadow:var(--px2);margin:2px}
.boss .kills{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.empty{padding:20px;text-align:center;color:var(--muted)}
input{font:inherit;border:0;box-shadow:var(--px2);background:var(--paper2);padding:10px;margin:2px;width:calc(100% - 4px)}
.login{max-width:380px;margin:10vh auto 0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:8px 0 0}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%;max-width:140px;text-align:center}
.podium .blk{width:100%;background:var(--gold);box-shadow:var(--px2);font-family:var(--f-title);font-size:26px;display:grid;place-items:center}
.podium .p b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
.track{position:relative;height:260px;background:repeating-linear-gradient(#7CC242 0 44px,#6CB43C 44px 88px);box-shadow:var(--px2);margin:2px;overflow:hidden}
.track .goal{position:absolute;right:6px;top:6px;font-size:24px}
.runner{position:absolute;display:flex;align-items:center;gap:4px}
.runner .tg{font-size:12px;background:var(--paper);padding:0 5px;box-shadow:var(--px2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.medal{font-size:28px}
@media (max-width:600px){.title{font-size:28px}.wrap{padding:12px 16px 32px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
document.head.insertAdjacentHTML('beforeend','<style>'+SK.ROAD_CSS+'</style>');
(function(){
const API=String((window.RR_CONFIG||{}).API_URL||'').trim();
const {KINGDOMS,SUBJ,SUBJ_KEYS,DAILY_CAP,HIDDEN,RAIDS,BASE}=SK;
const dayKey=()=>SK.dayKey(),addDays=SK.addDays,parseDay=SK.parseDay;
function keysOf(t){const k=dayKey();if(t==='today')return [k];if(t==='week'){const w=SK.weekKey(k);return [...Array(7)].map((_,i)=>addDays(w,i))}
  if(t==='lastweek'){const w=addDays(SK.weekKey(k),-7);return [...Array(7)].map((_,i)=>addDays(w,i))}
  const pre=k.slice(0,7);const out=[];let d=pre+'-01';while(d.slice(0,7)===pre){out.push(d);d=addDays(d,1)}return out}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
function token(){for(const k of ['sk-auth-v1','sk-admin-v1']){try{const a=JSON.parse(localStorage.getItem(k)||'null');if(a&&a.token)return {t:a.token,k,id:a.id}}catch(e){}}return null}
let TOK=token(),D=null,ERR='',TAB='race',PER='week',lastAt=0;
try{TAB=localStorage.getItem('sk-rank-tab')||'race'}catch(e){}
async function api(action,data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOK?TOK.t:''},data||{}))});const j=await r.json();if(!j.ok){const e=new Error(j.error);e.code=j.code;throw e}return j}
async function load(){try{const j=await api('roster');D=j.students||{};ERR='';lastAt=Date.now()}catch(e){if(e.code==='auth'){try{localStorage.removeItem(TOK.k)}catch(x){}TOK=null}ERR=e.message||'인터넷 연결을 확인해 주세요'}render()}
function sum(p,keys){const d=p.daily||{};return keys.reduce((a,k)=>a+(d[k]?d[k].r||0:0),0)}
function dmSum(p,from,to){const d=p.daily||{};return Object.keys(d).reduce((a,k)=>a+(k>=from&&k<=to?(d[k].dm||0):0),0)}
function players(){const mk=keysOf('month');return Object.keys(D||{}).map(id=>({id,...D[id]})).filter(p=>p.char&&sum(p,mk)>0)}
function av(p,sc){return `<span class="av">${SK.heroTag(p.char,sc||2)}</span>`}
function board(p){const mk=dayKey().slice(0,7);return p.board&&p.board.mk===mk?p.board:{boss:{},season:p.board?p.board.season:0}}
const MEDAL=['🥇','🥈','🥉'];
function render(){
  if(!API){app.innerHTML=`<div class="card login"><h1 class="title" style="font-size:28px">스터디아 랭킹</h1><p class="small">config.js 에 서버 주소가 아직 없어요. 설치 안내서를 봐 주세요.</p><a class="small" href="./">학생 앱으로 가기</a></div>`;return}
  if(!TOK){app.innerHTML=`<div class="card login"><h1 class="title" style="font-size:28px">스터디아 랭킹</h1><p class="small">학생 아이디나 선생님 아이디로 들어와요. 같은 기기에서 학생 앱에 로그인돼 있으면 바로 열려요.</p>
    ${ERR?`<p class="small" style="color:var(--red)">${esc(ERR)}</p>`:''}
    <form id="lf" style="display:flex;flex-direction:column;gap:6px"><input id="lid" placeholder="아이디" autocomplete="username" autocapitalize="none"><input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btn" id="lgo">입장</button></form>
    <a class="small" href="./">학생 앱으로 가기</a></div>`;
    app.querySelector('#lf').onsubmit=async e=>{e.preventDefault();const b=app.querySelector('#lgo');b.disabled=true;
      try{const j=await (await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',id:app.querySelector('#lid').value.trim().toLowerCase(),pw:app.querySelector('#lpw').value})})).json();
        if(!j.ok)throw new Error(j.error);const k=j.role==='admin'?'sk-admin-v1':'sk-auth-v1';localStorage.setItem(k,JSON.stringify({token:j.token,id:j.id,name:j.name}));TOK={t:j.token,k,id:j.id};ERR='';load()}
      catch(x){ERR=x.message;b.disabled=false;render()}};return}
  if(!D){app.innerHTML=`<div class="card"><h2>랭킹을 불러오는 중...</h2>${ERR?`<p class="small" style="color:var(--red)">${esc(ERR)}</p>`:''}</div>`;return}
  const P=players();const today=dayKey();const mo=Number(today.slice(5,7));
  let h=`<div class="top"><h1 class="title">스터디아 랭킹</h1><span class="sp"></span><span class="tag">${mo}월 시즌</span><span class="tag">${P.length}명 참여</span><a class="btn ghost" href="./">내 앱</a></div>
  <div class="tabs">${[['race','캐릭터 레이스'],['zone','권역 대항전'],['boss','보스 현황'],['team','반 협동 레이드']].map(([k,l])=>`<button data-t="${k}" aria-pressed="${TAB===k}">${l}</button>`).join('')}</div>`;
  if(!P.length)h+=`<div class="card empty">아직 이번 달에 공부를 체크한 모험가가 없어요. 첫 체크를 하면 여기에 나타나요.</div>`;
  else if(TAB==='race'){
    const keys=keysOf(PER);const list=P.map(p=>({p,v:sum(p,keys)})).sort((a,b)=>b.v-a.v);const max=Math.max(1,...list.map(x=>x.v));
    const prev=keysOf('lastweek');const grow=P.map(p=>({p,g:sum(p,keysOf('week'))-sum(p,prev),a:sum(p,prev)})).filter(x=>x.a>0).sort((a,b)=>b.g-a.g)[0];
    h+=`<div class="card"><div class="sub">${[['today','오늘'],['week','이번 주'],['month','이번 달']].map(([k,l])=>`<button data-p="${k}" aria-pressed="${PER===k}">${l}</button>`).join('')}</div>
      ${SK.raceRoad(list.map(x=>({c:x.p.char,n:x.p.char.name,v:x.v,me:TOK&&x.p.id===TOK.id})),{h:340,medal:MEDAL})}
      <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">${list.slice(0,3).filter(x=>x.v>0).map((x,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="medal">${MEDAL[i]}</span>${av(x.p,3)}<b>${esc(x.p.char.name)}</b></div>`).join('')}</div>
      <p class="tiny muted">1~3등만 메달로 보여 주고, 나머지는 지도 위 위치로만 보여 줘요. 하루 랭킹 점수는 ${DAILY_CAP}점까지(연속 보너스·선생님 포인트는 따로). 1분마다 새로 고침.</p></div>
    <div class="card"><h2>성장왕 👑</h2>${grow&&grow.g>0?`<div style="display:flex;gap:10px;align-items:center">${av(grow.p,3)}<p><b>${esc(grow.p.char.name)}</b> · 지난주보다 +${grow.g}점</p></div>`:'<p class="small muted">지난주 기록이 쌓이면 지난주보다 가장 많이 오른 모험가가 나와요.</p>'}</div>`;
  }
  else if(TAB==='zone'){
    const keys=keysOf('month');
    const rows=SK.ZONES.map(([z,zn])=>{const mem=P.filter(p=>KINGDOMS[p.char.kingdom]&&KINGDOMS[p.char.kingdom].zone===z);const tot=mem.reduce((a,p)=>a+sum(p,keys),0);return {z,zn,mem,tot,avg:mem.length?tot/mem.length:0}}).sort((a,b)=>b.avg-a.avg);
    const max=Math.max(1,...rows.map(r=>r.avg));
    h+=`<div class="card"><h2>이달의 권역 대항전</h2><p class="small muted">한 반은 인원이 적어서 9개 왕국 대신 권역 3개가 겨뤄요. 총합이 아니라 <b>1인당 평균 점수</b>예요.</p>
      ${rows.map((r,i)=>`<div class="kd"><div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b style="font-size:17px">${r.mem.length&&i<3?MEDAL[i]+' ':''}${r.zn}</b><span class="tiny muted">${Object.keys(KINGDOMS).filter(k=>KINGDOMS[k].zone===r.z).map(k=>KINGDOMS[k].n).join(' · ')}</span></div>
        <div class="bar gold"><i style="width:${Math.round(r.avg/max*100)}%"></i></div>
        <div class="tiny">${r.mem.length}명 · 1인당 <b>${r.mem.length?r.avg.toFixed(1):'-'}</b>점</div>
        <div class="members">${r.mem.map(p=>`<span class="tiny" style="background:#fff;padding:1px 6px;box-shadow:var(--px2);margin:2px">${esc(p.char.name)}</span>`).join('')}</div></div></div>`).join('')}</div>`;
  }
  else if(TAB==='boss'){
    h+=`<div class="card"><h2>${mo}월 과목 보스 현황</h2><p class="small muted">보스는 모험가마다 한 마리씩 따로 있어요. 이번 달에 처치한 모험가만 칭호와 함께 보여 줘요.</p>
      ${SUBJ_KEYS.map(s=>{const B=SUBJ[s];const killers=P.filter(p=>(board(p).boss[s]||0)>=B.hp);
        return `<div class="boss"><span data-spr="${s}" data-sc="4"></span><div style="min-width:0"><div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap"><b style="font-size:16px">${B.boss}</b><span class="tiny muted">${B.n} · HP ${B.hp.toLocaleString()} · 칭호 [${esc(B.title)}]</span></div>
          <div class="kills">${killers.length?killers.map(p=>`<span class="pill">${esc(p.char.name)}</span>`).join(''):'<span class="tiny muted">아직 처치한 모험가가 없어요</span>'}</div></div></div>`}).join('')}</div>`;
  }
  else if(TAB==='team'){
    const hs=(()=>{const y=+today.slice(0,4),m=+today.slice(5,7);return ymd(m>=3?y:y-1,3,1)})();
    const total=P.reduce((a,p)=>a+(board(p).season||0),0);const teamHP=HIDDEN.hp*P.length;
    const raid=RAIDS.map(r=>{const y=+today.slice(0,4);let best=null;[y-1,y,y+1].forEach(yy=>r.specs.forEach(sp=>{const os=ymd(yy,sp.m,1),oe=ymd(yy,sp.m+1,0),as=ymd(yy,sp.m-sp.n,1);if(oe>=today&&(!best||oe<best.oe))best={r,sp,os,oe,as}}));return best}).sort((a,b)=>a.os<b.os?-1:1)[0];
    const charge=P.reduce((a,p)=>a+dmSum(p,raid.as,today),0);const rcap=raid.sp.n*BASE*10*P.length;
    h+=`<div class="card dark"><div style="display:flex;gap:12px;align-items:center"><span data-spr="hidden" data-sc="5"></span><div><h2>꿈의 문 수문장 · 반 전체</h2><p class="small muted">${SK.fmt(hs)}부터 1년 동안 모두가 넣은 데미지예요. 한 사람 몫 HP ${HIDDEN.hp.toLocaleString()} × ${P.length}명.</p></div></div>
      <div class="bar purple" style="height:18px"><i style="width:${Math.min(100,Math.round(total/teamHP*100))}%"></i></div><p class="small">모두 함께 <b class="pxn">${total.toLocaleString()}</b> / ${teamHP.toLocaleString()}</p></div>
    <div class="card"><div style="display:flex;gap:12px;align-items:center"><span data-spr="${raid.r.id}" data-sc="4"></span><div><h2>다음 레이드 · ${esc(raid.r.n)}</h2><p class="small muted">${esc(raid.r.when)} · ${SK.fmt(raid.os)}에 문이 열려요. 반 전체가 모은 충전 게이지예요.</p></div></div>
      <div class="bar blue" style="height:18px"><i style="width:${Math.min(100,Math.round(charge/rcap*100))}%"></i></div><p class="small">충전 <b class="pxn">${Math.min(charge,rcap).toLocaleString()}</b> / ${rcap.toLocaleString()}</p>
      <p class="tiny muted">개인 순위 없이 반 전체 합계 막대 하나로만 보여 줘요.</p></div>`;
  }
  h+=`<p class="tiny muted" style="text-align:center" id="upd"></p>`;
  app.innerHTML=h;SK.hydrate(app);
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;try{localStorage.setItem('sk-rank-tab',TAB)}catch(e){}render()});
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{PER=b.dataset.p;render()});
  tick();
}
function ymd(y,m,d){return SK.key(new Date(y,m-1,d))}
function tick(){const u=document.getElementById('upd');if(u&&lastAt){const m=Math.round((Date.now()-lastAt)/60000);u.textContent=(m<1?'방금':m+'분 전')+' 기준'}}
setInterval(()=>{if(TOK&&!document.hidden)load()},60000);setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOK&&Date.now()-lastAt>30000)load()});
render();if(TOK&&API)load();
})();
</script>
</body>
</html>
