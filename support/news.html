 {type:'event',date:'2026-11-26',start:'2026-12-01',end:'2026-12-31',title:'🛡 12월 1일부터 반 협동 주간 레이드 시작',

 {type:'notice',date:'2026-11-27',title:'[선생님] 현황을 오늘·어제·주·달로 바꿔 볼 수 있어요',
  body:'<p>선생님 화면의 [오늘] 탭이 [현황] 탭이 됐어요. 오늘, 어제, 이번 주, 지난주, 이번 달 버튼과 주·달 고르기로 기간을 바꾸면 학생 현황 표(점수, 체크한 날, 데미지, 자주 나온 몰입 칸)와 몰입 분포가 그 기간으로 바뀌어요.</p>'},
 {type:'notice',date:'2026-11-27',title:'랭킹 레이스가 스터디아 성으로 가는 길이 됐어요',
  body:'<p>주간 단거리·월간 마라톤 레이스가 직선 트랙 대신 구불구불한 길로 바뀌었어요. 공부 점수만큼 길을 따라 걸어가고, 1등은 스터디아 성 바로 앞까지 가요. 내 캐릭터는 노란 이름표로 표시돼요.</p>'},
 {type:'notice',date:'2026-11-27',title:'파트너가 같이 공격해요! (12월부터 추가 데미지)',

 {type:'notice',date:'2026-11-26',title:'스터디아 왕국 키즈 업데이트 안내 (손맛·방패·알 부화)',
  body:'<ul><li><b>CRITICAL!·MEGA HIT!</b>: 체크할 때 15% 확률로 ×1.5, 3% 확률로 ×2</li><li><b>콤보</b>: 하루 2·3·4번째 체크 +10·20·30%, <b>골든타임</b> 저녁 7~9시 +20%</li><li><b>감정 태그</b>: 체크할 때 [쉬웠어][조금 힘들어][해냈다!]를 골라요</li><li><b>스트릭 방패</b>: 5일 연속이면 1개(최대 2개). 못 한 날 자동으로 연속 기록과 보스 반격을 막아 줘요</li><li><b>문제 1개만!</b> 힘든 날엔 최소 시동 퀘스트로 출석 인정</li><li><b>알 부화</b>: 불꽃·비취·심해·성운 알 중 하나를 골라 공부 점수로 키워요. 부화한 파트너는 도감에 모이고 1마리를 데리고 다녀요</li><li>보스 체력이 1.3배로 올랐어요(보너스가 늘어서). 랭킹 점수는 그대로예요</li></ul><p class="small">자세한 건 <a href="student.html#partner">학생 가이드</a>.</p>'},
 {type:'notice',date:'2026-11-26',title:'보호자 리포트는 보호자 링크로만 볼 수 있어요',
  body:'<p>아이 앱의 [보호자 화면] 버튼이 없어졌어요. 보호자께서는 선생님이 보낸 <b>입장 안내문의 "보호자 리포트" 주소</b>로 우리 아이 기록을 보세요. 홈 화면에 추가해 두면 편해요.</p>'},
 {type:'notice',date:'2026-11-26',title:'스터디아 왕국 키즈가 11월 30일에 문을 열어요',
  body:'<p>선생님께 받은 입장 안내문으로 들어와요. 처음 들어가면 성향 테스트로 왕국을 정하고 동물 캐릭터를 만들어요. <b>공부 체크는 매일 밤 12시까지</b>예요. 홈 화면에 추가해 두면 앱처럼 쓸 수 있어요.</p>'}
];
(function(){var T=new Date(),today=T.getFullYear()+'-'+String(T.getMonth()+1).padStart(2,'0')+'-'+String(T.getDate()).padStart(2,'0');
 var tab=(location.hash==='#notice')?'notice':'event';
 function fmt(k){var p=k.split('-');return Number(p[1])+'/'+Number(p[2])}
 function draw(){document.querySelectorAll('[data-nt]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.nt===tab)});
  var L=NEWS.filter(function(n){return n.type===tab});
  document.getElementById('newslist').innerHTML=L.map(function(n,i){var st='';if(n.type==='event'){st=today>n.end?'<span class="nbadge end">종료</span>':today<n.start?'<span class="nbadge soon">예정</span>':'<span class="nbadge on">진행 중</span>'}
   return '<details class="card news"'+(i===0||(n.type==='event'&&today<=n.end)?' open':'')+'><summary><span class="ndate">'+n.date.replace(/-/g,'.')+'</span>'+st+'<b>'+n.title+'</b>'+(n.type==='event'?'<span class="tiny muted"> · '+fmt(n.start)+'~'+fmt(n.end)+'</span>':'')+'</summary><div class="nbody">'+n.body+'</div></details>'}).join('')||'<p class="muted">아직 글이 없어요.</p>'}
 document.querySelectorAll('[data-nt]').forEach(function(b){b.onclick=function(){tab=b.dataset.nt;history.replaceState(null,'','#'+tab);draw()}});draw()})();
</script>
